    <!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Trái Tim Đập Kín ❤️</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #030305; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let w = canvas.width = window.innerWidth;
    let h = canvas.height = window.innerHeight;

    window.onresize = () => {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      init();
    };

    function drawSmallHeart(x, y, size) {
      ctx.save();
      ctx.translate(x, y);
      ctx.beginPath();
      const top = size * 0.3;
      ctx.moveTo(0, top);
      ctx.bezierCurveTo(0, 0, -size / 2, 0, -size / 2, top);
      ctx.bezierCurveTo(-size / 2, (size + top) / 2, 0, size, 0, size);
      ctx.bezierCurveTo(0, size, size / 2, (size + top) / 2, size / 2, top);
      ctx.bezierCurveTo(size / 2, 0, 0, 0, 0, top);
      ctx.fillStyle = '#ff0a2d';
      ctx.shadowColor = '#ff2b4c';
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.restore();
    }

    function isInHeart(x, y, scale) {
      const nx = x / scale;
      const ny = -y / scale;
      const x2 = nx * 0.95;
      const y2 = ny * 0.9 + 0.3;
      const a = x2 * x2 + y2 * y2 - 1;
      return (a * a * a - x2 * x2 * y2 * y2 * y2) < 0;
    }

    let pts = [];
    function init() {
      pts = [];
      const scale = Math.min(w, h) / 3.0;
      const spacing = 11;

      for (let y = -scale * 1.5; y < scale * 1.5; y += spacing) {
        for (let x = -scale * 1.5; x < scale * 1.5; x += spacing) {
          if (isInHeart(x, y, scale * 0.75)) {
            pts.push({
              x: x,
              y: y,
              s: Math.random() * 2 + 10.5,
              offset: Math.random() * 6.28
            });
          }
        }
      }
    }

    let time = 0;
    function loop() {
      ctx.fillStyle = 'rgba(3, 3, 5, 0.3)';
      ctx.fillRect(0, 0, w, h);

      time += 0.055;
      const beat = 1 + (Math.sin(time) + Math.sin(time * 2) * 0.5) * 0.085;

      const cx = w / 2;
      const cy = h / 2 + 30;

      // 1. Vẽ các trái tim đỏ lấp đầy
      for (let i = 0; i < pts.length; i++) {
        const p = pts[i];
        const curX = cx + p.x * beat;
        const curY = cy + p.y * beat;
        const size = p.s * (0.88 + 0.18 * Math.sin(time + p.offset)) * beat;
        drawSmallHeart(curX, curY, size);
      }

      // 2. Vẽ chữ "Thái Trân" màu đen nổi bật ở giữa trái tim
      ctx.save();
      const fontSize = Math.min(w, h) / 10 * beat;
      ctx.font = `900 ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      // Viền trắng/hồng mờ nhẹ để chữ đen nổi hẳn lên trên nền đỏ
      ctx.shadowColor = 'rgba(255, 255, 255, 0.7)';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#0a0a0f'; // Màu đen tuyền
      ctx.fillText('Thái Trân', cx, cy - 25 * beat);
      ctx.restore();

      requestAnimationFrame(loop);
    }

    init();
    loop();
  </script>
</body>
</html>
